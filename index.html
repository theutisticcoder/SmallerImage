<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SamllerImage</title>
</head>

<body>
    <script type="module">
        import ollama from 'https://cdn.jsdelivr.net/npm/ollama@0.6.3/+esm'
        const response = await ollama.chat({
            model: 'smollm:latest',
            messages: [{role: 'user', content: 'Design a 500x500 image of a hawk by putting the r, g, and b into their own arrays in 16 bit pixel by pixel. example: {r: [r1, r2, r3], g:[g1, g2, g3], b: [g1, g2, g3]}.'}],
        })
        var digits = JSON.parse(response.message.content);
        var canvas= document.querySelector("#c");
        var ctx = canvas.getContext("2d");
        for(let i = 0; i< 500; i++){
           for(let j = 0; j< 500; j++){
            ctx.fillstyle = "#" + digits.r[i+j] + digits.g[i+j] + digits.b[i+j];

        }
        }
    </script>
</body>

</html>
